# Every push and pull request: type-check, unit tests (engine, exporters, UI logic) and the Rust tests.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Students install on Linux and Windows: run everything on both, so path, encoding and line-ending
    # differences show up here rather than on a student's PC.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run
        env:
          XS_LTSPICE_DIR: ${{ runner.temp }}/xs-ltspice

      # tauri::generate_context! embeds the built frontend, so the Rust crate needs dist/ to compile
      - name: Build the frontend
        run: npx vite build

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

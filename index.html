<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/ui/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Crossover Studio</title>
    <script>
      // Resolve the theme before the first paint so a light-theme user never sees a dark flash.
      (function () {
        var t = "dark";
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var saved = JSON.parse(localStorage.getItem("crossover-studio:v1") || "{}").theme;
          var choice = q === "light" || q === "dark" ? q : saved || "dark";
          t = choice === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : choice;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
